// JEEP - Connected Vehicle India Plaform - location telemetry message
// Protocol definition files using Protocol Buffers - Google's data interchange format

syntax = "proto3";
package stla.cvip.jeep;
option java_package = "stla.cvip.jeep";
option java_outer_classname = "StlaJeepLocationTelemetry";

import "jeep_locationtelemetry.proto";
import "jeep_common.proto";
import "timestamp.proto";


message LocationTelemetryMessage {
	string message_id = 1;
	eTboxOperatingState tbox_operating_state = 2;
	eTboxApplicationState e_tbox_application_state = 3;
    eTboxeSimState tbox_esim_state = 4;
	string version = 5;
	google.protobuf.Timestamp time_stamp = 6;
	LocationTelemetryPayload locationPayload = 7;
	double signalStrength = 8;
}
