<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
    <meta name="referrer" content="strict-origin-when-cross-origin" /> -->
    <meta name="description" content="InnoIDE - Innovative Development Environment" />
    <!-- ✓ Updated CSP with Dyte CDN allowed -->
     <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src
        'self'
        'unsafe-inline'
        'unsafe-eval'
        https://accounts.google.com
        https://*.googleusercontent.com
        https://cdn.dyte.io
        https://cdn.dyte.in;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https: blob:;
      font-src 'self' https://fonts.gstatic.com;
      frame-src 'self' https://accounts.google.com https://*.google.com;
      connect-src
        'self'
        https://eureka.innotrat.in
        https://*.google.com
        https://www.googleapis.com
        https://api.dyte.io
        https://*.dyte.io;
    "> 
    <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src
    'self'
    'unsafe-inline'
    'unsafe-eval'
    https://cdn.dyte.io
    https://cdn.dyte.in
    https://accounts.google.com
    https://*.googleusercontent.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  img-src 'self' data: https: blob:;
  font-src 'self' https://fonts.gstatic.com;
  frame-src 'self' https://accounts.google.com https://*.google.com;
  connect-src
    'self'
    https://api.dyte.io
    https://*.dyte.io
    https://eureka.innotrat.in
    https://*.google.com
    https://www.googleapis.com;
"> 
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- <title>InnoIDE</title> -->
    <!-- Preconnect -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preconnect" href="https://eureka.innotrat.in" />
    <!-- Google Sign-in popup communication -->
    <script>
      window.addEventListener("load", () => {
        if (window.opener && window.opener !== window) {
          window.opener.postMessage({ type: "GOOGLE_SIGN_IN" }, "*");
        }
      });
    </script>
    <!-- ✓ Dyte SDK (NOW ALLOWED BY CSP) -->
    <script src="https://cdn.dyte.io/v1.31.0/dyte.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
