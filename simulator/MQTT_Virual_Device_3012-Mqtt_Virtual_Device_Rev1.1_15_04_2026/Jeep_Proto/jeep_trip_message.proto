// JEEP - Connected Vehicle India Plaform - Tripstart message
// Protocol definition files using Protocol Buffers - Google's data interchange format

syntax = "proto3";
package stla.cvip.jeep;
option java_package = "stla.cvip.jeep";
option java_outer_classname = "StlaJeepTrip";

import "jeep_trip.proto";
import "jeep_common.proto";
import "timestamp.proto";


message TripPayload{
oneof tripPayload {
	TripStartPayload tripstartpayload = 1;
	TripInProgressPayload tripinprogresspayload = 2;
	TripEndedPayload tripendedpayload = 3;
}
}



message TripMessage {
	string message_id = 1;
	eTboxOperatingState tbox_operating_state = 2;
	eTboxApplicationState e_tbox_application_state = 3;
        eTboxeSimState tbox_esim_state = 4;
	string version = 5;
	google.protobuf.Timestamp time_stamp = 6;
	TripPayload tripPayload = 7;
}
