
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .root {
    min-height: 500px;
    background: #000;
    display: flex;
    align-items: stretch;
    border-radius: 16px;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    position: relative;
  }
  .left {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #060818;
    min-height: 500px;
  }
  .wave-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* Ribbon path animations */
  @keyframes ribbonMorph1 {
    0%   { d: path("M 60 60 C 120 40, 260 80, 300 160 C 340 240, 260 300, 280 380 C 295 430, 350 450, 380 460"); }
    25%  { d: path("M 50 80 C 130 30, 280 100, 310 180 C 345 265, 240 310, 270 395 C 288 445, 360 458, 395 465"); }
    50%  { d: path("M 70 40 C 110 55, 240 60, 285 145 C 330 225, 275 285, 295 365 C 308 415, 345 440, 370 455"); }
    75%  { d: path("M 45 70 C 140 20, 270 90, 305 170 C 342 255, 250 305, 275 388 C 292 438, 355 455, 388 462"); }
    100% { d: path("M 60 60 C 120 40, 260 80, 300 160 C 340 240, 260 300, 280 380 C 295 430, 350 450, 380 460"); }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.6; }
  }
  @keyframes glowPulse2 {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  @keyframes rotateCX1 {
    0%, 100% { cx: 240px; cy: 220px; }
    50% { cx: 260px; cy: 200px; }
  }
  .ribbon-glow { animation: glowPulse 4s ease-in-out infinite; }
  .ribbon-glow2 { animation: glowPulse2 3.5s ease-in-out infinite 1s; }

  /* Card transition styles */
  .right {
    width: 340px;
    background: #fff;
    border-radius: 18px;
    margin: 18px 18px 18px 0;
    padding: 36px 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
    position: relative;
    overflow: hidden;
  }
  .form-panel {
    width: 100%;
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 36px 32px 28px;
    transition: all 0.6s cubic-bezier(0.77, 0, 0.175, 1);
  }
  #login-panel {
    transform: translateX(0);
    opacity: 1;
  }
  #signup-panel {
    transform: translateX(110%);
    opacity: 0;
  }
  .right.show-signup #login-panel {
    transform: translateX(-110%);
    opacity: 0;
  }
  .right.show-signup #signup-panel {
    transform: translateX(0);
    opacity: 1;
  }
  .form-title {
    font-size: 20px;
    font-weight: 600;
    color: #111;
    margin-bottom: 14px;
    text-align: center;
  }
  .welcome {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    text-align: center;
    margin-bottom: 2px;
  }
  .sub {
    font-size: 12px;
    color: #555;
    text-align: center;
    margin-bottom: 18px;
  }
  .field {
    width: 100%;
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: #222;
    margin-bottom: 4px;
  }
  .field label span { color: #e00; }
  .field input {
    width: 100%;
    height: 32px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 0 10px;
    font-size: 13px;
    outline: none;
    background: #fff;
    color: #111;
    transition: border 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    border-color: #1a1aab;
    box-shadow: 0 0 0 3px rgba(26,26,171,0.08);
  }
  .btn {
    width: 100%;
    height: 36px;
    background: #1a1aab;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 6px;
    margin-bottom: 12px;
    letter-spacing: 0.3px;
    transition: background 0.2s, transform 0.15s;
  }
  .btn:hover { background: #13138a; transform: scale(1.02); }
  .btn:active { transform: scale(0.98); }
  .switch-text {
    font-size: 12px;
    color: #333;
    text-align: center;
  }
  .switch-text a {
    color: #1a1aab;
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
  }
  .switch-text a:hover { text-decoration: underline; }
</style>

<div class="root">
  <div class="left">

        <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">

      <!-- Sharp highlight line -->

      <!-- Tiny bright center line -->

      <!-- Contour lines -->
      <path d="M 10 100 C 80 70, 300 110, 350 210 C 390 290, 290 360, 320 450 C 335 490, 390 510, 430 510" stroke="#1a2a7a" stroke-width="1" fill="none" opacity="0.55"/>
      <path d="M 5 140 C 90 105, 320 150, 370 260 C 405 335, 305 405, 340 490" stroke="#1a2a7a" stroke-width="1" fill="none" opacity="0.45"/>
      <path d="M 20 50 C 70 20, 280 50, 330 140 C 375 215, 275 295, 300 390 C 316 440, 370 460, 400 468" stroke="#1a2a7a" stroke-width="1" fill="none" opacity="0.45"/>
      <path d="M 0 180 C 100 145, 340 180, 395 295 C 430 370, 325 440, 360 510" stroke="#1a2a7a" stroke-width="1" fill="none" opacity="0.35"/>
      <path d="M -10 30 C 60 8, 230 55, 270 140 C 310 220, 228 294, 250 378 C 264 425, 315 445, 345 455" stroke="#1a2a7a" stroke-width="1" fill="none" opacity="0.45"/>
    </svg>
  </div>

  <div class="right" id="card">
    <!-- LOGIN -->
    <div class="form-panel" id="login-panel">
      <div class="form-title">Login</div>
      <div class="welcome">Welcome Back!</div>

      <div class="field">
        <label>Email <span>*</span></label>

    <!-- SIGNUP -->

<script>
// ── Ribbon animation via JS (SMIL-free, works everywhere) ──
const ribbonPaths = {
  login: {
    outer: "M 60 60 C 120 40, 260 80, 300 160 C 340 240, 260 300, 280 380 C 295 430, 350 450, 380 460",
    main:  "M 60 60 C 120 40, 260 80, 300 160 C 340 240, 260 300, 280 380 C 295 430, 350 450, 380 460",
    mid:   "M 72 52 C 130 32, 252 72, 290 152 C 325 228, 248 292, 268 372 C 283 422, 338 442, 368 452",
    hi:    "M 80 56 C 138 36, 254 76, 292 155 C 326 230, 250 294, 271 374 C 285 423, 340 443, 370 453",
    ctr:   "M 84 58 C 140 38, 256 78, 294 156 C 327 231, 251 295, 272 375 C 286 424, 341 444, 371 454",
  },
  a: {
    outer: "M 50 80 C 130 30, 280 100, 310 180 C 345 265, 240 310, 270 395 C 288 445, 360 458, 395 465",
    main:  "M 50 80 C 130 30, 280 100, 310 180 C 345 265, 240 310, 270 395 C 288 445, 360 458, 395 465",
    mid:   "M 62 72 C 140 22, 272 92, 298 172 C 330 255, 226 302, 256 388 C 273 438, 345 450, 380 458",
    hi:    "M 70 76 C 148 26, 274 94, 298 173 C 330 256, 228 304, 257 389 C 274 439, 346 451, 381 459",
    ctr:   "M 74 78 C 150 28, 276 96, 300 174 C 331 257, 229 305, 258 390 C 275 440, 347 452, 382 460",
  },
  b: {
    outer: "M 70 40 C 110 55, 240 60, 285 145 C 330 225, 275 285, 295 365 C 308 415, 345 440, 370 455",
    main:  "M 70 40 C 110 55, 240 60, 285 145 C 330 225, 275 285, 295 365 C 308 415, 345 440, 370 455",
    mid:   "M 82 32 C 118 47, 232 52, 273 137 C 315 217, 261 277, 281 357 C 293 407, 330 432, 356 447",
    hi:    "M 90 36 C 120 49, 234 54, 275 138 C 316 218, 262 278, 282 358 C 294 408, 331 433, 357 448",
    ctr:   "M 94 38 C 122 50, 236 56, 277 139 C 317 219, 263 279, 283 359 C 295 409, 332 434, 358 449",
  },
  c: {
    outer: "M 45 70 C 140 20, 270 90, 305 170 C 342 255, 250 305, 275 388 C 292 438, 355 455, 388 462",
    main:  "M 45 70 C 140 20, 270 90, 305 170 C 342 255, 250 305, 275 388 C 292 438, 355 455, 388 462",
    mid:   "M 57 62 C 148 12, 262 82, 293 162 C 327 247, 236 297, 261 380 C 277 430, 340 447, 373 454",
    hi:    "M 65 66 C 150 14, 264 84, 295 163 C 328 248, 237 298, 262 381 C 278 431, 341 448, 374 455",
    ctr:   "M 69 68 C 152 16, 266 86, 297 164 C 329 249, 238 299, 263 382 C 279 432, 342 449, 375 456",
  }
};

const keys = ['a','b','c','login'];
let keyIdx = 0;
const els = {
  outer: document.getElementById('r-outer'),
  main:  document.getElementById('r-main'),
  mid:   document.getElementById('r-mid'),
  hi:    document.getElementById('r-hi'),
  ctr:   document.getElementById('r-ctr'),
};

// Parse a path "d" into cubic bezier control points
function parseCubics(d) {
  const nums = d.match(/-?\d+\.?\d*/g).map(Number);
  const pts = [];
  for (let i = 0; i < nums.length; i += 2) pts.push([nums[i], nums[i+1]]);
  return pts;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

function buildPath(pts) {
  return `M ${pts[0][0]} ${pts[0][1]} C ${pts[1][0]} ${pts[1][1]}, ${pts[2][0]} ${pts[2][1]}, ${pts[3][0]} ${pts[3][1]} C ${pts[4][0]} ${pts[4][1]}, ${pts[5][0]} ${pts[5][1]}, ${pts[6][0]} ${pts[6][1]} C ${pts[7][0]} ${pts[7][1]}, ${pts[8][0]} ${pts[8][1]}, ${pts[9][0]} ${pts[9][1]}`;
}

function animateRibbon(fromKey, toKey, duration, done) {
  const from = ribbonPaths[fromKey];
  const to   = ribbonPaths[toKey];
  const parsed = {};
  for (const k of ['outer','main','mid','hi','ctr']) {
    parsed[k] = { from: parseCubics(from[k]), to: parseCubics(to[k]) };
  }
  const start = performance.now();
  function step(now) {
    const raw = Math.min((now - start) / duration, 1);
    const t = easeInOut(raw);
    for (const k of ['outer','main','mid','hi','ctr']) {
      const { from: f, to: to_ } = parsed[k];
      const pts = f.map((fp, i) => [lerp(fp[0], to_[i][0], t), lerp(fp[1], to_[i][1], t)]);
      els[k].setAttribute('d', buildPath(pts));
    }
    if (raw < 1) requestAnimationFrame(step);
    else if (done) done();
  }
  requestAnimationFrame(step);
}

// Loop through ribbon shapes
function nextShape() {
  const from = keys[keyIdx % keys.length];
  keyIdx++;
  const to = keys[keyIdx % keys.length];
  animateRibbon(from, to, 2800, () => {
    setTimeout(nextShape, 600);
  });
}
setTimeout(nextShape, 1200);

// ── Card transition ──
const card = document.getElementById('card');

function showSignup() {
  card.classList.add('show-signup');
  // Also morph ribbon faster on transition
  const from = keys[keyIdx % keys.length];
  keyIdx++;
  const to = keys[keyIdx % keys.length];
  animateRibbon(from, to, 700, null);
}
function showLogin() {
  card.classList.remove('show-signup');
  const from = keys[keyIdx % keys.length];
  keyIdx++;
  const to = keys[keyIdx % keys.length];
  animateRibbon(from, to, 700, null);
}

// Resize card height to match visible panel
function syncHeight() {
  const active = card.classList.contains('show-signup')
    ? document.getElementById('signup-panel')
    : document.getElementById('login-panel');
  card.style.height = active.scrollHeight + 'px';
}
// Initial height
setTimeout(() => {
  const lp = document.getElementById('login-panel');
  const sp = document.getElementById('signup-panel');
  sp.style.visibility = 'hidden';
  sp.style.transform = 'translateX(0)';
  const sh = sp.scrollHeight;
  sp.style.transform = '';
  sp.style.visibility = '';
  card.style.height = Math.max(lp.scrollHeight, sh) + 72 + 'px';
}, 100);
</script>
